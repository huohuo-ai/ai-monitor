<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - AI模型性能拨测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #333;
            font-weight: 600;
        }
        .login-header p {
            color: #666;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-weight: 600;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .alert {
            display: none;
        }
        .alert.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>🔐 管理后台</h2>
            <p>AI模型性能拨测系统</p>
        </div>
        
        <div id="errorAlert" class="alert alert-danger"></div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" required placeholder="请输入用户名">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" id="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn btn-primary btn-login">
                <span class="normal-text">登录</span>
                <span class="loading-text d-none">
                    <span class="spinner-border spinner-border-sm"></span> 登录中...
                </span>
            </button>
        </form>
        
        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none">← 返回首页</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            const normalText = btn.querySelector('.normal-text');
            const loadingText = btn.querySelector('.loading-text');
            const errorAlert = document.getElementById('errorAlert');
            
            normalText.classList.add('d-none');
            loadingText.classList.remove('d-none');
            btn.disabled = true;
            errorAlert.classList.remove('show');
            
            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorAlert.textContent = data.error || '登录失败';
                    errorAlert.classList.add('show');
                }
            } catch (error) {
                errorAlert.textContent = '网络错误，请稍后重试';
                errorAlert.classList.add('show');
            } finally {
                normalText.classList.remove('d-none');
                loadingText.classList.add('d-none');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
